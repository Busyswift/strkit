name: Task
description: A small, well-scoped piece of work
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify.
      value: |
        - [ ] 
        - [ ] Tests cover it
        - [ ] `lint` and `test` checks pass
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: Hints
      description: Optional pointers to the relevant code.
